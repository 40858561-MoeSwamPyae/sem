name: A workflow for my Hello World App
on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup network
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo
          docker run -d --name mongo-db-target --network se-methods mongo
      - name: Build with Maven
        run: mvn package
      - name: Build Docker image
        run: docker build -t sem-app .
      - name: Run image
        run: docker run --network se-methods --name devopscontainer sem-app
      - name: View logs
        run: docker logs devopscontainer